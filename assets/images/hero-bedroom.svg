<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="Cream mattress on a wooden bed in a green bedroom" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E5A45"/><stop offset="1" stop-color="#1E3A2E"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9985E"/><stop offset="1" stop-color="#A8743F"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#FFD98A" stop-opacity=".75"/><stop offset="1" stop-color="#FFD98A" stop-opacity="0"/></radialGradient>
    <pattern id="ribs" width="14" height="10" patternUnits="userSpaceOnUse"><rect width="14" height="10" fill="#F2E6CC"/><rect x="12" width="2" height="10" fill="#E2D2AE"/></pattern>
  </defs>
  <rect width="800" height="640" fill="url(#wall)"/>
  <polygon points="90,0 220,0 130,430 0,430" fill="#fff" opacity=".05"/>
  <polygon points="250,0 330,0 240,430 160,430" fill="#fff" opacity=".04"/>
  <rect y="430" width="800" height="210" fill="url(#floor)"/>
  <rect x="60" y="500" width="680" height="110" rx="18" fill="#E2BD86" opacity=".75"/>
  <!-- bed frame -->
  <rect x="130" y="418" width="540" height="34" rx="6" fill="#6B3F22"/>
  <rect x="160" y="450" width="20" height="58" fill="#59321B"/>
  <rect x="620" y="450" width="20" height="58" fill="#59321B"/>
  <!-- mattress -->
  <rect x="120" y="336" width="560" height="84" rx="14" fill="url(#ribs)"/>
  <polygon points="165,296 635,296 690,338 110,338" fill="#F8EEDA"/>
  <rect x="372" y="360" width="56" height="30" rx="3" fill="#FAF4E6" stroke="#D9C9A5"/>
  <text x="400" y="380" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1E3A2E">8rest</text>
  <!-- pillows, cushion, blanket -->
  <rect x="235" y="226" width="170" height="82" rx="34" fill="#F6E9D0" transform="rotate(-4 320 267)"/>
  <rect x="405" y="222" width="170" height="86" rx="34" fill="#F8EEDA" transform="rotate(3 490 265)"/>
  <circle cx="400" cy="268" r="38" fill="#24503C"/>
  <rect x="300" y="296" width="230" height="30" rx="15" fill="#EADBB8"/>
  <!-- nightstand + lamp -->
  <rect x="700" y="372" width="62" height="130" rx="6" fill="#6B3F22"/>
  <circle cx="731" cy="330" r="70" fill="url(#glow)"/>
  <rect x="727" y="338" width="8" height="34" fill="#C9B58A"/>
  <path d="M703 340 a28 28 0 0 1 56 0 z" fill="#F6C97A"/>
  <!-- plant -->
  <rect x="34" y="430" width="78" height="82" rx="14" fill="#D7C09A"/>
  <g fill="#3F7A4F">
    <ellipse cx="72" cy="380" rx="16" ry="48"/>
    <ellipse cx="42" cy="394" rx="14" ry="40" transform="rotate(-28 42 394)"/>
    <ellipse cx="104" cy="394" rx="14" ry="40" transform="rotate(28 104 394)"/>
    <ellipse cx="58" cy="350" rx="12" ry="34" transform="rotate(-14 58 350)" fill="#4E9061"/>
  </g>
</svg>
